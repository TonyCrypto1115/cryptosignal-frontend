<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>幣圈週報圖卡｜CryptoSignal Tony</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#fdf7f2;--card:#fff;--border:rgba(200,168,148,.18);
  --text:#221a16;--soft:#8a6e62;--muted:#c4a898;
  --coral:#e06050;--rose:#c8506a;--up:#28a870;--down:#e04858;
  --line:#e8d6ca;--mono:'DM Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans','PingFang TC','Noto Sans TC',sans-serif;
  background:#efe6de;color:var(--text);padding:20px}

.bar{max-width:1080px;margin:0 auto 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:9px 16px;border-radius:20px;border:1px solid var(--border);background:#fff;
  color:var(--text);font-size:13px;font-weight:600;cursor:pointer}
.btn.on{background:var(--coral);color:#fff;border-color:var(--coral)}
.btn:disabled{opacity:.5;cursor:default}
.panel{max-width:1080px;margin:0 auto 14px;background:#fff;border-radius:14px;padding:14px;
  display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.panel label{flex:1;min-width:160px}
.lb{font-size:12px;color:var(--soft);margin-bottom:4px}
.inp{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;
  font-size:14px;background:#fdf7f2;font-family:inherit}
/* 手機上好打：字級放大、行高拉開、可多行 */
.inp.big{font-size:17px;padding:13px 14px;line-height:1.6;border-radius:11px}
textarea.inp{resize:vertical;min-height:88px}
.btn.lg{padding:13px 26px;font-size:15px}
.sug{font-size:15px;padding:13px 16px}
@media(max-width:620px){
  .inp.big{font-size:17px}
  .panel label{min-width:100%}
  .btn.lg{width:100%}
}
.tip{max-width:1080px;margin:0 auto 14px;font-size:12px;color:var(--soft);line-height:1.7}
.stat{max-width:1080px;margin:0 auto 14px;font-family:var(--mono);font-size:12px;color:var(--soft)}

/* ── 圖卡 ── */
.shot{width:1080px;height:1350px;background:var(--bg);position:relative;overflow:hidden;
  margin:0 auto 24px;transform-origin:top left}
.glow{position:absolute;border-radius:50%}
.g1{width:780px;height:780px;left:-390px;top:-390px;background:rgba(224,96,80,.05)}
.g2{width:700px;height:700px;right:-350px;top:-233px;background:rgba(200,80,106,.05)}
.inner{position:relative;padding:80px}
.hd{display:flex;justify-content:space-between;font-size:25px;color:var(--muted);margin-bottom:34px}
.tag{display:inline-block;background:var(--coral);color:#fff;font-size:24px;font-weight:700;
  padding:9px 17px;border-radius:14px;margin-bottom:26px}
h1{font-size:62px;font-weight:700;letter-spacing:-1px;line-height:1.3}
h1 .c{color:var(--coral)}
h1 .r{color:var(--rose)}
.rule{width:190px;height:6px;background:var(--coral);border-radius:3px;margin:22px 0 34px}
.bx{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:44px 36px}
.bx.t{font-size:38px;font-weight:700;line-height:1.55}
.nt{font-size:34px;color:var(--soft);line-height:1.5;margin-top:34px}
.nt.dk{color:var(--text)}
.pq{font-size:38px;font-weight:700;color:var(--coral);line-height:1.45;margin-top:30px}
.ft{position:absolute;left:80px;right:80px;bottom:70px}
.ft .ln{height:2px;background:var(--line);margin-bottom:20px}
.ft .rw{display:flex;justify-content:space-between;font-size:24px;color:var(--muted)}

/* 資料列 */
.row{display:flex;align-items:center;gap:14px;background:var(--card);
  border:2px solid var(--line);border-radius:16px;padding:0 30px;height:96px;margin-bottom:16px}
.row .nm{font-size:33px;font-weight:600;flex:1;white-space:nowrap}
.row .sub{font-size:22px;color:var(--muted);margin-left:8px;font-weight:400}
.row .vl{font-family:var(--mono);font-size:38px;font-weight:500;min-width:170px;text-align:right}
.up{color:var(--up)}.dn{color:var(--down)}.fl{color:var(--muted)}
/* 緊湊列：一張卡要塞 10 列時用 */
.row.sm{height:66px;margin-bottom:10px;padding:0 28px}
.row.sm .nm{font-size:30px}
.row.sm .vl{font-size:33px;min-width:160px}
.hl{font-size:27px;font-weight:700;margin-bottom:12px}
/* 結論卡 */
.lead{font-size:27px;color:var(--soft);line-height:1.62;margin-bottom:26px}
.cc{background:var(--card);border:2px solid var(--line);border-radius:18px;
  padding:26px 30px;margin-bottom:16px}
.cc-t{font-size:33px;font-weight:700;line-height:1.35;display:flex;gap:14px;align-items:flex-start}
.cc-n{display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:40px;height:40px;border-radius:12px;background:var(--coral);color:#fff;
  font-size:23px;font-weight:700;margin-top:3px}
.cc-b{font-size:25px;color:var(--soft);line-height:1.62;margin-top:12px;padding-left:54px}

/* 條狀圖 */
.bar2{height:14px;border-radius:7px;background:rgba(200,168,148,.22);
  flex:1;position:relative;overflow:hidden;margin:0 6px}
.bar2 i{position:absolute;top:0;bottom:0;border-radius:7px}

/* 大數字 */
.big{background:var(--card);border:2px solid var(--line);border-radius:22px;
  padding:32px 36px;margin-bottom:18px}
.big .l{font-size:29px;color:var(--soft);margin-bottom:10px}
.big .v{font-family:var(--mono);font-size:72px;font-weight:500;letter-spacing:-2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two .big{margin:0}
.two .v{font-size:56px}

.sug{text-align:left;padding:10px 14px;border-radius:10px;border:1px solid var(--border);
  background:#fdf7f2;font-family:inherit;font-size:14px;line-height:1.5;cursor:pointer;color:var(--text)}
.sug:hover{border-color:var(--coral);background:#fff}
.sug b{color:var(--coral);font-size:12px;display:block;margin-bottom:2px;font-weight:700}

#out{display:none;max-width:1080px;margin:0 auto 24px;background:#fff;
  border-radius:16px;padding:16px;text-align:center}
#out img{width:100%;max-width:520px;border-radius:12px;margin-top:8px;
  box-shadow:0 3px 14px rgba(0,0,0,.12)}
</style>
</head>
<body>

<div class="bar">
  <button class="btn on" data-c="1">① 封面</button>
  <button class="btn" data-c="2">② 結論</button>
  <button class="btn" data-c="3">③ 板塊</button>
  <button class="btn" data-c="4">④ 主流幣</button>
  <button class="btn" data-c="5">⑤ 市場寬度</button>
  <button class="btn" data-c="6">⑥ 情緒</button>
  <button class="btn" id="reload">↻ 重抓資料</button>
  <button class="btn" id="dl" style="margin-left:auto">🖼 產生圖片</button>
</div>

<div class="panel">
  <label style="flex:1 1 100%"><div class="lb">封面定調（你自己寫的一句話，可換行）</div>
    <textarea id="i-head" class="inp big" rows="3"
      placeholder="例：漲的是指數，不是你的持倉"></textarea></label>
  <label style="min-width:110px;flex:0 1 130px"><div class="lb">第幾週</div>
    <input id="i-week" class="inp big" type="number" value="1"/></label>
  <label style="min-width:160px"><div class="lb">恐慌貪婪指數（抓不到時手動填）</div>
    <input id="i-fg" class="inp big" type="number" placeholder="自動"/></label>
  <button class="btn lg" id="apply">套用</button>
</div>

<div class="panel" id="sugbox" style="display:none;flex-direction:column;align-items:stretch;gap:8px">
  <div class="lb" style="margin:0">💡 依本週數據自動建議（點一下帶入，再自己改）</div>
  <div id="sugs" style="display:flex;flex-direction:column;gap:7px"></div>
</div>

<div class="tip">
  資料自動從 Bybit 抓取，統計<b>本週一開盤到現在</b>的漲跌（週一當天開啟則統計剛結束的那一整週）。第一次載入約需 20–40 秒。<br/>
  <b>手機：</b>產生後長按圖片即可存到相簿。切換上方分頁可逐張產生。
</div>
<div class="stat" id="stat">準備中…</div>

<div id="out">
  <div style="font-size:14px;font-weight:700">✅ 圖片產生完成</div>
  <div style="font-size:13px;color:#8a6e62;margin-top:4px" id="out-tip"></div>
  <img id="out-img"/>
</div>

<div class="shot" id="shot">
  <div class="glow g1"></div><div class="glow g2"></div>
  <div class="inner">
    <div class="hd"><span id="h-l">幣圈週報</span><span id="h-r">1 / 6</span></div>
    <div id="body"></div>
  </div>
  <div class="ft">
    <div class="ln"></div>
    <div class="rw">
      <span>@CryptoSignal_Tony</span>
      <span id="f-r">資料來源 Bybit</span>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
//  板塊分類。沒列到的幣會歸入「其他」。
//  想調整分類，直接改這張表即可。
// ══════════════════════════════════════════════════════════
const SECTOR = {
  "公鏈 L1":["BTC","ETH","SOL","BNB","ADA","AVAX","TRX","DOT","NEAR","APT","SUI","ATOM",
    "TON","ICP","ALGO","HBAR","SEI","INJ","TIA","KAS","XLM","XRP","LTC","BCH","ETC","FIL",
    "EOS","XTZ","EGLD","FLOW","MINA","ROSE","ONE","CELO","KAVA","ZIL","QTUM","WAVES","IOTA",
    "NEO","VET","CFX","KLAY","ASTR","CORE","BERA","MOVE","S","SOPH","PLUME","MON","HYPE"],
  "L2 / 擴容":["ARB","OP","MATIC","POL","STRK","ZK","MANTA","METIS","IMX","BLAST","SCR",
    "LRC","SKL","ZRO","TAIKO","MODE","LINEA","MERL","BOBA","OMNI"],
  "DeFi":["UNI","AAVE","LINK","MKR","CRV","LDO","PENDLE","ENA","JUP","RAY","CAKE","COMP",
    "SNX","DYDX","GMX","SUSHI","1INCH","ETHFI","EIGEN","REZ","SAFE","BAL","YFI","RUNE",
    "OSMO","JTO","DRIFT","HYPER","MORPHO","AERO","VELO","SYRUP","FLUID","SPK","KMNO"],
  "迷因幣":["DOGE","SHIB","PEPE","WIF","BONK","FLOKI","BOME","MEME","POPCAT","MEW","NEIRO",
    "TURBO","PNUT","ACT","GOAT","SPX","FARTCOIN","BRETT","MOG","DOGS","CAT","PEOPLE",
    "BABYDOGE","TRUMP","MELANIA","CHILLGUY","MOODENG","HIPPO","SLERF","MYRO","WEN","PUMP",
    "USELESS","TROLL","LAUNCHCOIN","HOUSE","AI16Z","GIGA","BAN","ZEREBRO"],
  "AI / DePIN":["FET","RENDER","TAO","AR","GRT","AKT","WLD","ARKM","AI","IO","NOS","THETA",
    "RNDR","VIRTUAL","AIXBT","GRASS","HNT","MOBILE","IOTX","OCEAN","AGIX","PHB","CTXC",
    "NMR","RSS3","ATH","SAHARA","PROMPT","CODEX","OPEN","KITE"],
  "RWA / 支付":["ONDO","POLYX","CFG","XDC","QNT","OM","PYTH","LINK","CHZ","ACH","XAI",
    "RSR","TRU","CPOOL","PROPS","HOME","USUAL","RLC"],
  "遊戲 / 社交":["SAND","MANA","AXS","GALA","APE","ENJ","PIXEL","BIGTIME","YGG","GMT","NOT",
    "HMSTR","CATI","MAVIA","PRIME","MAGIC","ILV","ALICE","TLM","SLP","VOXEL","NFP",
    "PORTAL","ACE","XAI","BLUR","LOOKS","FRIEND","GRASS"],
  "交易所幣":["OKB","CRO","KCS","GT","HT","MX","BGB","BNX","WOO","FTT","LEO"],
};
const SECTOR_OF = {};
Object.entries(SECTOR).forEach(([k,arr])=>arr.forEach(s=>{ if(!SECTOR_OF[s]) SECTOR_OF[s]=k; }));

// ══════════════════════════════════════════════════════════
//  主流幣 —— 第三張「漲跌榜」只看這些。
//  想加減直接改這個陣列。
// ══════════════════════════════════════════════════════════
const MAJORS = ["BTC","ETH","SOL","BNB","XRP","ADA","DOGE","AVAX","TRX","DOT",
  "LINK","LTC","BCH","UNI","AAVE","ATOM","NEAR","APT","SUI","TON",
  "SHIB","PEPE","ARB","OP","FIL","ETC","XLM","HBAR","ICP","INJ",
  "TIA","RENDER","FET","LDO","ONDO","JUP","ENA","WIF","STX","SEI"];
const IS_MAJOR = new Set(MAJORS);

// ══════════════════════════════════════════════════════════
//  排除非加密商品。
//  Bybit 上有代幣化美股與槓桿 ETF 合約（SOXL / SOXS / KORU / SNXX …），
//  它們會污染板塊與寬度統計，一律剔除。
// ══════════════════════════════════════════════════════════
const EXCLUDE = new Set([
  "SOXL","SOXS","SNXX","KORU","TSLL","TSLQ","NVDL","NVDS","CONL","MSTX","MSTZ",
  "FNGU","FNGD","TQQQ","SQQQ","SPXL","SPXS","LABU","LABD","YINN","YANG",
  "GDXU","GDXD","BOIL","KOLD","UVXY","SVXY","TMF","TMV",
  "TSLA","NVDA","AAPL","MSFT","META","AMZN","GOOGL","COIN","MSTR","HOOD",
  "XAUT","PAXG","USDC","USDE","FDUSD","TUSD","DAI","USDT",
]);
// 另外這些字樣出現在幣名裡，通常也是槓桿或合成商品
const EXCLUDE_PAT = /(\d+L$|\d+S$|BULL$|BEAR$|UP$|DOWN$|^X[A-Z]{2,}\d)/;

const MIN_TURNOVER = 3_000_000;   // 24h 成交額門檻，濾掉沒流動性的
const MAX_COINS    = 90;          // 取成交額前 N 名

let DATA = null, page = 1;

const $  = id => document.getElementById(id);
const sg = n => (n>=0?"+":"") + n.toFixed(2);
const cl = n => n>0?"up":(n<0?"dn":"fl");

async function jget(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}

// ── 抓資料 ────────────────────────────────────────────────
async function loadData(){
  $("stat").textContent = "抓取行情中…";

  const tj = await jget("https://api.bybit.com/v5/market/tickers?category=linear");
  if(tj.retCode!==0) throw new Error("Bybit tickers 失敗");

  let universe = tj.result.list
    .filter(t=>t.symbol.endsWith("USDT"))
    .filter(t=>parseFloat(t.turnover24h||0) >= MIN_TURNOVER)
    .map(t=>({
      symbol: t.symbol,
      name:   t.symbol.replace("USDT",""),
      price:  parseFloat(t.lastPrice),
      turnover: parseFloat(t.turnover24h),
      funding: parseFloat(t.fundingRate||0),
    }))
    // 剔除代幣化美股、槓桿 ETF、穩定幣
    .filter(c => !EXCLUDE.has(c.name) && !EXCLUDE_PAT.test(c.name))
    .sort((a,b)=>b.turnover-a.turnover)
    .slice(0, MAX_COINS);

  // 本週一到今天。週一當天開這份報表的話，改用剛結束的那一整週。
  const dow  = new Date().getDay();        // 0=日 1=一 … 6=六
  const back = (dow + 6) % 7;              // 距離本週一幾天：一=0、二=1 … 日=6
  const useFullLastWeek = (back === 0);
  const offset = useFullLastWeek ? 7 : back;   // 基準 K 棒要往回數幾根

  // 逐檔抓日線（併發 6，對 API 客氣一點）
  const out = [];
  let done = 0;
  async function worker(queue){
    while(queue.length){
      const c = queue.shift();
      try{
        const kj = await jget(
          `https://api.bybit.com/v5/market/kline?category=linear&symbol=${c.symbol}&interval=D&limit=24`);
        if(kj.retCode===0 && kj.result?.list?.length >= offset+9){
          const k = kj.result.list.slice().reverse();          // 舊→新
          const open  = k.map(x=>parseFloat(x[1]));
          const close = k.map(x=>parseFloat(x[4]));
          const n = k.length;

          // 本週：週一開盤 → 現在
          const iMon = n-1-offset;
          const base = open[iMon];
          const end  = useFullLastWeek ? close[n-1] : c.price;
          const w1 = (end/base-1)*100;

          // 上週：上上週一開盤 → 上週日收盤（完整一週）
          const iPrevMon = iMon-7;
          const w0 = (close[iMon-1]/open[iPrevMon]-1)*100;

          if(isFinite(w1) && isFinite(w0)) out.push({...c, w1, w0});
        }
      }catch(e){}
      done++;
      if(done%10===0) $("stat").textContent = `抓取 K 線中… ${done}/${universe.length}`;
    }
  }
  const q = universe.slice();
  await Promise.all([1,2,3,4,5,6].map(()=>worker(q)));

  // 恐慌貪婪（抓不到就留空，可手動填）
  let fg = null;
  try{
    const fj = await jget("https://api.alternative.me/fng/?limit=2");
    fg = { now:+fj.data[0].value, prev:+fj.data[1].value, label:fj.data[0].value_classification };
  }catch(e){}

  const btc = out.find(c=>c.name==="BTC");
  DATA = {
    coins: out,
    btc,
    fg,
    upCount:   out.filter(c=>c.w1>0).length,
    beatBtc:   btc ? out.filter(c=>c.w1>btc.w1).length : 0,
    avgFunding: out.reduce((s,c)=>s+c.funding,0)/out.length*100,
    at: new Date(),
    days: useFullLastWeek ? 7 : back+1,
    fullLastWeek: useFullLastWeek,
  };
  $("stat").textContent =
    `✅ ${out.length} 檔 ・ ${DATA.at.toLocaleString("zh-TW")} ・ 統計區間：${dateRange()}（${DATA.days} 天）`;
}

// ── 板塊彙總 ──────────────────────────────────────────────
function sectors(){
  const m = {};
  DATA.coins.forEach(c=>{
    const s = SECTOR_OF[c.name] || "其他";
    (m[s] = m[s] || []).push(c);
  });
  return Object.entries(m)
    .filter(([k,a])=>k!=="其他" && a.length>=3)   // 「其他」不是板塊，不參與排名與輪動
    .map(([k,a])=>({
      name:k, n:a.length,
      w1:a.reduce((s,c)=>s+c.w1,0)/a.length,
      w0:a.reduce((s,c)=>s+c.w0,0)/a.length,
    }))
    .sort((a,b)=>b.w1-a.w1);
}

// 本週一 → 今天。若今天就是週一，改顯示剛結束的那一整週。
const dateRange = ()=>{
  const f = d => `${d.getMonth()+1}/${d.getDate()}`;
  const now = new Date(), dow = now.getDay(), back = (dow+6)%7;
  if(back === 0){
    const e = new Date(Date.now()-864e5), s = new Date(Date.now()-7*864e5);
    return `${f(s)} – ${f(e)}`;
  }
  return `${f(new Date(Date.now()-back*864e5))} – ${f(now)}`;
};

// ══════════════════════════════════════════════════════════
//  標題自動建議 —— 依本週數據找出最有張力的角度。
//  輸出「標題 / 角度說明」，點一下帶入欄位，再自己改。
//  <br/> 代表換行。
// ══════════════════════════════════════════════════════════
function suggestHeads(){
  const d = DATA, n = d.coins.length, out = [];
  const pUp   = d.upCount/n*100;
  const pBeat = d.beatBtc/n*100;
  const sec   = sectors();
  const srt   = d.coins.slice().sort((a,b)=>b.w1-a.w1);
  const best = srt[0], worst = srt[n-1];
  const strong = sec[0], weak = sec[sec.length-1];
  const flip = sec.filter(s=>s.w0<0 && s.w1>0);
  const fade = sec.filter(s=>s.w0>0 && s.w1<0);

  // ① 指數與個股背離 —— 最有記憶點的角度
  if(d.btc.w1 > 0 && pUp < 45)
    out.push(["背離", `BTC 漲了 ${sg(d.btc.w1)}%，<br/><span class="c">${(100-pUp).toFixed(0)}% 的幣卻在跌</span>`]);
  if(d.btc.w1 < 0 && pUp > 55)
    out.push(["背離", `BTC 跌了，<br/><span class="c">但多數幣逆勢收紅</span>`]);

  // ② 板塊輪動
  if(flip.length)
    out.push(["輪動", `錢換位置了，<br/><span class="c">${flip[0].name}</span>本週翻正`]);
  if(fade.length && !flip.length)
    out.push(["輪動", `<span class="c">${fade[0].name}</span>熄火，<br/>上週的強勢不見了`]);

  // ③ 板塊強弱差距
  if(strong && weak && (strong.w1-weak.w1) > 12)
    out.push(["分化", `同一個市場，<br/><span class="c">${strong.name}與${weak.name}差了 ${(strong.w1-weak.w1).toFixed(0)} 個百分點</span>`]);

  // ④ 寬度極端
  if(pUp >= 75) out.push(["普漲", `<span class="c">${pUp.toFixed(0)}% 的幣在漲</span>，<br/>這種週很少見`]);
  if(pUp <= 25) out.push(["普跌", `只有 <span class="c">${pUp.toFixed(0)}% 的幣收紅</span>，<br/>這不是回檔，是退潮`]);

  // ⑤ 跑贏 BTC 的比例
  if(pBeat <= 30) out.push(["集中", `<span class="c">${(100-pBeat).toFixed(0)}% 的幣輸給 BTC</span>，<br/>拿山寨不如拿大餅`]);
  if(pBeat >= 65) out.push(["擴散", `<span class="c">${pBeat.toFixed(0)}% 的幣跑贏 BTC</span>，<br/>資金開始往外走`]);

  // ⑥ 個別極端值
  if(best && best.w1 > 25)
    out.push(["極端", `${best.name} 本週 <span class="c">${sg(best.w1)}%</span>，<br/>而你大概沒有`]);
  if(worst && worst.w1 < -20)
    out.push(["極端", `${worst.name} 跌了 <span class="c">${Math.abs(worst.w1).toFixed(0)}%</span>，<br/>沒有新聞，就是跌`]);

  // ⑦ 情緒 vs 價格
  if(d.fg && d.fg.prev!=null && Math.abs(d.fg.now-d.fg.prev) >= 12)
    out.push(["情緒", `情緒指數一週跳了 <span class="c">${Math.abs(d.fg.now-d.fg.prev)} 點</span>，<br/>價格卻沒走那麼遠`]);

  // ⑧ 資金費率擁擠
  if(d.avgFunding > 0.012)
    out.push(["擁擠", `多單在付錢，<br/><span class="c">而且付得比上週多</span>`]);

  // 保底
  out.push(["中性", `本週 <span class="c">${d.upCount}/${n}</span> 檔收紅，<br/>${pUp>=50?"多數人還在場上":"場上的人少了"}`]);

  return out.slice(0,4);
}

// ══════════════════════════════════════════════════════════
//  第六張：結論與判斷依據
//  ─────────────────────────────────────────────────────────
//  每條結論都要「兩個以上的指標交叉」才成立，不做單一數字的
//  直覺反應（例如「漲了所以看多」）。每條都附上推論依據，
//  讀者可以自己檢查這個推論合不合理。
// ══════════════════════════════════════════════════════════
function conclude(){
  const d = DATA, n = d.coins.length;
  const pUp   = d.upCount/n*100;
  const pBeat = d.beatBtc/n*100;
  const sec   = sectors();
  const flip  = sec.filter(s=>s.w0<0 && s.w1>0);
  const fade  = sec.filter(s=>s.w0>0 && s.w1<0);
  const strong = sec[0], weak = sec[sec.length-1];
  const spread = (strong&&weak) ? strong.w1-weak.w1 : 0;
  const fr = d.avgFunding;
  const fgJump = (d.fg && d.fg.prev!=null) ? d.fg.now-d.fg.prev : null;
  const R = [];

  // ① 指數 vs 寬度：判斷「行情」是真的還是被少數幣撐起來的
  if(d.btc.w1 > 1 && pUp < 45) R.push([9,
    "這不是全面行情，是少數幣在撐",
    `BTC 上漲 ${sg(d.btc.w1)}%，但只有 ${pUp.toFixed(0)}% 的幣收紅。指數由權重最大的幣決定，當多數成分在跌、指數仍漲，代表漲幅集中在少數標的。`]);
  if(d.btc.w1 < -1 && pUp > 55) R.push([9,
    "大盤在跌，但賣壓沒有擴散",
    `BTC 下跌 ${sg(d.btc.w1)}%，卻有 ${pUp.toFixed(0)}% 的幣收紅。跌的是權重，不是整個市場。`]);

  // ② 槓桿 vs 寬度：擁擠的多單碰上不足的買盤
  if(fr > 0.008 && pUp < 50) R.push([8,
    "多單擁擠，但買盤跟不上",
    `平均資金費率 ${fr.toFixed(3)}%（做多的人在付錢給做空的人），同時僅 ${pUp.toFixed(0)}% 的幣上漲。願意付成本做多的人多，實際把價格推上去的買盤少，這種結構在回檔時容易連鎖平倉。`]);
  if(fr < -0.003 && pUp > 55) R.push([8,
    "空單在付錢，而價格在漲",
    `平均資金費率 ${fr.toFixed(3)}% 為負，代表做空的人在付錢，但同時 ${pUp.toFixed(0)}% 的幣上漲。空方部位正在承受成本。`]);

  // ③ 資金輪動 vs 離場：兩者看起來很像，但意義相反
  const broad = (pUp<=30 || pUp>=72);   // 寬度走極端時，輪動的說法不成立
  if(!broad && flip.length && fade.length) R.push([7,
    "錢在換位置，不是在離場",
    `${flip[0].name}由負轉正，同時${fade[0].name}轉弱。一邊進一邊出，資金總量沒有明顯流失，屬於板塊輪動而非整體撤出。`]);
  if(!broad && !flip.length && fade.length >= 2) R.push([7,
    "沒有接棒的板塊",
    `${fade.slice(0,2).map(s=>s.name).join("、")}都從正轉負，而沒有任何板塊由負轉正。資金離開了，但沒有出現新的去處。`]);

  // ④ 寬度走到極端：單一指標但幅度本身就是結構訊號
  if(pUp <= 25) R.push([8,
    "賣壓是全面的，不是輪跌",
    `只有 ${pUp.toFixed(0)}% 的幣收紅。輪跌時資金會在板塊間移動、寬度維持在中間；寬度壓到這個程度，代表賣壓同時發生在各個板塊。`]);
  if(pUp >= 72) R.push([8,
    "買盤是全面的，不是單點",
    `${pUp.toFixed(0)}% 的幣收紅。當上漲集中在題材時寬度不會這麼高，這個數字代表買盤同時出現在多數板塊。`]);

  // ⑤ 跑贏 BTC 的比例：資金是集中還是擴散
  if(pBeat < 35) R.push([6,
    "山寨季還沒有開始",
    `${(100-pBeat).toFixed(0)}% 的幣跑輸 BTC。在資金擴散的階段，這個數字通常會低於五成；目前資金仍停留在流動性最好的地方。`]);
  if(pBeat > 62) R.push([6,
    "資金正在往外圍移動",
    `${pBeat.toFixed(0)}% 的幣跑贏 BTC。多數標的表現勝過龍頭，通常出現在風險偏好上升的階段。`]);

  // ⑥ 板塊分化：提醒「看大盤會誤判」
  if(spread > 14) R.push([5,
    "用大盤判斷持倉會失準",
    `最強的${strong.name}與最弱的${weak.name}相差 ${spread.toFixed(0)} 個百分點。同一週裡不同板塊的體感可以完全相反，整體漲跌對個別持倉的參考價值有限。`]);

  // ⑦ 情緒 vs 價格：情緒是否跑在基本面前面
  if(fgJump!=null && Math.abs(fgJump) >= 10 && Math.abs(d.btc.w1) < 4) R.push([4,
    "情緒的波動大於價格",
    `恐慌貪婪指數一週變動 ${fgJump>0?"+":""}${fgJump} 點，但 BTC 只走了 ${sg(d.btc.w1)}%。情緒指標本身包含社群聲量與波動率，它的變化不等於價格變化。`]);

  // ── 補充條目 ──
  // 規則不足 3 條時從這裡補。這些只描述事實、不宣稱「沒有極端」，
  // 所以不論當週數據長怎樣都不會自相矛盾。
  const FILL = [];
  if(strong && strong.w1 > 0) FILL.push([3,
    `資金本週集中在${strong.name}`,
    `${strong.name}以 ${sg(strong.w1)}% 居各板塊之首${strong.n?`，其中有 ${strong.n} 檔成分幣`:""}。板塊平均能拉開差距，通常代表買盤有共同的主題，而不是個別標的的消息面。`]);
  if(strong && strong.w1 <= 0) FILL.push([3,
    "沒有任何板塊收紅",
    `表現最好的${strong.name}也只有 ${sg(strong.w1)}%。當連最強的板塊都收黑，代表這週的下跌沒有主題上的例外。`]);
  if(weak && strong && weak.name!==strong.name && weak.w1 < 0) FILL.push([2,
    `${weak.name}是本週最弱的一塊`,
    `${weak.name}平均 ${sg(weak.w1)}%，落在所有板塊最後。單一幣種走弱可能是個案，整個板塊走弱通常是資金撤出該主題。`]);
  if(weak && strong && weak.name!==strong.name && weak.w1 >= 0) FILL.push([2,
    "所有板塊都是正報酬",
    `連墊底的${weak.name}都收在 ${sg(weak.w1)}%。全部板塊同向上漲，通常是整體資金流入，而不是個別題材輪動。`]);
  FILL.push([1,
    fr >= 0 ? "多單仍在付出持有成本" : "空單仍在付出持有成本",
    `平均資金費率 ${fr.toFixed(3)}%。${fr>=0 ? "為正代表多方付錢給空方，持有多單每天都在扣成本。" : "為負代表空方付錢給多方，持有空單每天都在扣成本。"}這個數字反映的是槓桿部位的方向，不是價格的方向。`]);
  FILL.push([0,
    "本週的結構變化有限",
    `上漲比例 ${pUp.toFixed(0)}%、跑贏 BTC ${pBeat.toFixed(0)}%、板塊最大價差 ${spread.toFixed(0)} 個百分點。這些數字之間沒有互相印證的訊號，單看任何一個都不足以下判斷。`]);

  // 規則優先，不足才補，並且避免重複標題
  const seen = new Set(R.map(x=>x[1]));
  for(const f of FILL){ if(R.length>=3) break; if(!seen.has(f[1])){ R.push(f); seen.add(f[1]); } }

  R.sort((a,b)=>b[0]-a[0]);
  const items = R.slice(0,3);
  // 最強的那條升格為標題與導言，列點只放其餘兩條，避免標題和第 1 點重複
  return { summary: items[0][1], lead: items[0][2], items: items.slice(1) };
}

function card6(){
  const c = conclude();
  return `
    <div class="tag">本週結論</div>
    <h1 style="font-size:54px">${c.summary}</h1>
    <div class="rule" style="margin:20px 0 22px"></div>

      以上是從數據推出的觀察，不是預測，也不是買賣建議。</div>`;
}

const CARDS = [card1, card6, card2, card3, card4, card5];

  $("body").innerHTML = CARDS[page-1]();

};

function fit(){
  const el=$("shot"), w=Math.min(window.innerWidth-40,1080), s=w/1080;
  el.style.transform=`scale(${s})`;
  el.style.marginBottom=(1350*s-1350+24)+"px";
}
window.addEventListener("resize",fit);
fit();
loadData().then(()=>{render();renderSugs();}).catch(e=>{ $("stat").textContent="❌ "+e.message; });
</script>
</body>
